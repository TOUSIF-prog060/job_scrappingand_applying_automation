version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HEADLESS=true
      - ENABLE_REAL_SUBMIT=false
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    restart: unless-stopped
